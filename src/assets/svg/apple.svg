<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Apple (maçã): Big cute apple with stem, leaf, and worm — chunky toddler style -->

  <!-- Apple body: large, round, friendly apple shape -->
  <path
    id="apple-body"
    d="M 200 120
       C 140 110, 60 150, 60 240
       C 60 320, 120 380, 200 380
       C 280 380, 340 320, 340 240
       C 340 150, 260 110, 200 120 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Stem: thick rounded stem at top -->
  <path
    id="apple-stem"
    d="M 192 120 C 190 100, 195 65, 205 55 C 215 48, 218 55, 215 65 C 210 80, 208 100, 208 120 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Leaf: cute round leaf attached to stem -->
  <path
    id="apple-leaf"
    d="M 210 75 C 230 60, 270 55, 290 65 C 300 70, 295 85, 275 90 C 255 95, 225 90, 210 80 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Leaf vein (decorative) -->
  <path d="M 215 77 C 240 74, 265 74, 280 78" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Worm: cute round worm peeking out from the apple -->
  <path
    id="apple-worm"
    d="M 270 210 C 290 200, 310 195, 320 200 C 340 210, 340 235, 325 240 C 315 243, 305 235, 305 225 C 305 215, 295 210, 285 215 C 275 220, 275 215, 270 210 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Worm face (decorative): tiny cute eye and smile -->
  <circle cx="322" cy="218" r="4" fill="#4a4a4a" />
  <circle cx="323" cy="216" r="1.5" fill="#FFFFFF" />
  <path d="M 318 228 C 322 232, 328 232, 330 228" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Apple highlight (decorative) -->
  <path d="M 140 180 C 145 165, 160 160, 165 170" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
</svg>
