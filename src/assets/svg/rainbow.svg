<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Rainbow (arco-íris): 4-band arc rainbow with clouds — chunky toddler style -->

  <!-- Band 1 (outermost) -->
  <path
    id="rainbow-band-1"
    d="M 40 310 A 180 180 0 0 1 360 310 L 340 310 A 160 160 0 0 0 60 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Band 2 -->
  <path
    id="rainbow-band-2"
    d="M 60 310 A 160 160 0 0 1 340 310 L 320 310 A 140 140 0 0 0 80 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Band 3 -->
  <path
    id="rainbow-band-3"
    d="M 80 310 A 140 140 0 0 1 320 310 L 300 310 A 120 120 0 0 0 100 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Band 4 (innermost) -->
  <path
    id="rainbow-band-4"
    d="M 100 310 A 120 120 0 0 1 300 310 L 280 310 A 100 100 0 0 0 120 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Cloud left: fluffy rounded cloud -->
  <path
    id="rainbow-cloud-left"
    d="M 15 310 C 10 280, 30 265, 50 270 C 55 250, 80 245, 95 260 C 105 248, 125 255, 125 270 C 140 270, 145 290, 135 305 C 140 315, 135 335, 115 335 C 110 345, 85 350, 75 340 C 60 350, 35 345, 30 330 C 15 335, 5 320, 15 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Cloud right: fluffy rounded cloud (mirrored) -->
  <path
    id="rainbow-cloud-right"
    d="M 385 310 C 390 280, 370 265, 350 270 C 345 250, 320 245, 305 260 C 295 248, 275 255, 275 270 C 260 270, 255 290, 265 305 C 260 315, 265 335, 285 335 C 290 345, 315 350, 325 340 C 340 350, 365 345, 370 330 C 385 335, 395 320, 385 310 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
