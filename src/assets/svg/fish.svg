<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fish (peixe): Cute fish swimming with bubbles — chunky toddler style -->

  <!-- Body: oval fish body -->
  <path
    id="fish-body"
    d="M 90 200
       C 90 130, 200 100, 280 130
       C 310 145, 320 175, 320 200
       C 320 225, 310 255, 280 270
       C 200 300, 90 270, 90 200 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Tail: triangular fan tail -->
  <path
    id="fish-tail"
    d="M 90 200
       L 30 130
       L 50 200
       L 30 270 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Top fin -->
  <path
    id="fish-top-fin"
    d="M 180 130
       C 195 90, 230 90, 240 110
       C 235 120, 220 130, 200 130 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Bottom fin -->
  <path
    id="fish-bottom-fin"
    d="M 200 270
       C 220 270, 235 280, 240 290
       C 230 305, 195 305, 180 270 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Side fin (smaller, decorative shape near front) -->
  <path
    id="fish-side-fin"
    d="M 190 200
       C 200 215, 220 220, 235 215
       C 230 230, 210 235, 195 230 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Eye -->
  <circle cx="265" cy="180" r="14" fill="#FFFFFF" stroke="#4a4a4a" stroke-width="3" />
  <circle cx="267" cy="180" r="6" fill="#4a4a4a" />
  <circle cx="269" cy="178" r="2" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M 275 215 C 282 222, 295 222, 300 215" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bubble 1 -->
  <circle cx="340" cy="120" r="14" fill="#FFFFFF" stroke="#4a4a4a" stroke-width="3" />
  <!-- Bubble 2 -->
  <circle cx="365" cy="80" r="9" fill="#FFFFFF" stroke="#4a4a4a" stroke-width="3" />
</svg>
