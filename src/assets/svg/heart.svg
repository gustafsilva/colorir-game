<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Heart (coração): Big chubby heart with smile and small hearts — chunky toddler style -->

  <!-- Main heart body -->
  <path
    id="heart-main"
    d="M 200 360
       C 140 310, 70 260, 60 190
       C 50 120, 130 70, 175 105
       C 190 118, 200 130, 200 145
       C 200 130, 210 118, 225 105
       C 270 70, 350 120, 340 190
       C 330 260, 260 310, 200 360 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Highlight (decorative) -->
  <path d="M 110 175 C 120 160, 140 155, 150 165" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />

  <!-- Left eye -->
  <circle cx="155" cy="195" r="9" fill="#4a4a4a" />
  <circle cx="157" cy="192" r="3" fill="#FFFFFF" />

  <!-- Right eye -->
  <circle cx="245" cy="195" r="9" fill="#4a4a4a" />
  <circle cx="247" cy="192" r="3" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M 175 235 C 185 255, 215 255, 225 235" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" />

  <!-- Cheek blush left -->
  <circle cx="130" cy="225" r="8" fill="#4a4a4a" opacity="0.18" />
  <!-- Cheek blush right -->
  <circle cx="270" cy="225" r="8" fill="#4a4a4a" opacity="0.18" />

  <!-- Tiny heart top-left -->
  <path
    id="heart-tiny-1"
    d="M 70 80
       C 60 70, 45 75, 50 92
       C 53 105, 70 115, 75 120
       C 80 115, 97 105, 100 92
       C 105 75, 90 70, 80 80 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Tiny heart top-right -->
  <path
    id="heart-tiny-2"
    d="M 320 80
       C 310 70, 295 75, 300 92
       C 303 105, 320 115, 325 120
       C 330 115, 347 105, 350 92
       C 355 75, 340 70, 330 80 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
