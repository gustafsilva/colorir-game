<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Banana: Cute thick curved banana lying horizontally — chunky toddler style -->

  <!-- Banana body: thick crescent arc -->
  <path
    id="banana-body"
    d="M 65 240
       C 50 200, 70 130, 130 105
       C 200 75, 290 95, 335 165
       C 345 180, 350 200, 340 215
       C 330 225, 318 215, 308 200
       C 280 155, 230 140, 180 155
       C 130 175, 100 220, 105 265
       C 110 285, 100 295, 85 285
       C 72 275, 64 258, 65 240 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Bottom curve fill region (the lower half of the banana) -->
  <path
    id="banana-belly"
    d="M 105 265
       C 110 305, 160 335, 220 330
       C 285 325, 340 280, 345 230
       C 348 220, 343 215, 335 220
       C 320 230, 310 245, 295 260
       C 270 285, 220 300, 175 290
       C 145 282, 125 270, 105 265 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Stem at left tip (pointing up-left) -->
  <path
    id="banana-stem"
    d="M 90 130
       C 80 110, 88 95, 105 100
       C 115 105, 110 120, 105 130
       Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Right tip dark mark -->
  <path d="M 333 213 C 343 214, 348 220, 343 228 C 338 234, 328 230, 322 222 Z" fill="#4a4a4a" />

  <!-- Left eye -->
  <circle cx="170" cy="200" r="9" fill="#4a4a4a" />
  <circle cx="172" cy="197" r="3" fill="#FFFFFF" />

  <!-- Right eye -->
  <circle cx="240" cy="195" r="9" fill="#4a4a4a" />
  <circle cx="242" cy="192" r="3" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M 180 230 C 195 248, 220 245, 235 225" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheek blush -->
  <circle cx="145" cy="230" r="7" fill="#4a4a4a" opacity="0.2" />
  <circle cx="265" cy="222" r="7" fill="#4a4a4a" opacity="0.2" />
</svg>
