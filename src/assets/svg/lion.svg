<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Lion (leão): Cute lion with wavy mane — chunky toddler style -->

  <!-- Mane: big wavy circle around the face -->
  <path
    id="lion-mane"
    d="M 200 60
       C 250 60, 290 75, 305 105
       C 335 100, 355 130, 345 160
       C 365 175, 365 215, 345 235
       C 360 265, 335 295, 305 290
       C 295 320, 250 340, 200 340
       C 150 340, 105 320, 95 290
       C 65 295, 40 265, 55 235
       C 35 215, 35 175, 55 160
       C 45 130, 65 100, 95 105
       C 110 75, 150 60, 200 60 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Face: smaller round face inside the mane -->
  <path
    id="lion-face"
    d="M 200 130
       C 145 130, 110 165, 110 210
       C 110 265, 150 305, 200 305
       C 250 305, 290 265, 290 210
       C 290 165, 255 130, 200 130 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Snout: oval muzzle area -->
  <path
    id="lion-snout"
    d="M 165 240
       C 165 225, 180 215, 200 215
       C 220 215, 235 225, 235 240
       C 235 265, 220 280, 200 280
       C 180 280, 165 265, 165 240 Z"
    fill="#FFFFFF"
    stroke="#4a4a4a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Nose: triangular -->
  <path d="M 188 230 L 212 230 L 200 245 Z" fill="#4a4a4a" />

  <!-- Mouth line -->
  <path d="M 200 245 L 200 260" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 200 260 C 195 268, 185 268, 182 263" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 200 260 C 205 268, 215 268, 218 263" fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left eye -->
  <circle cx="170" cy="195" r="9" fill="#4a4a4a" />
  <circle cx="172" cy="192" r="3" fill="#FFFFFF" />

  <!-- Right eye -->
  <circle cx="230" cy="195" r="9" fill="#4a4a4a" />
  <circle cx="232" cy="192" r="3" fill="#FFFFFF" />

  <!-- Mane texture details (decorative) -->
  <path d="M 90 180 C 95 175, 105 175, 110 180" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 290 180 C 295 175, 305 175, 310 180" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 180 95 C 188 88, 198 88, 205 95" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round" />
</svg>
